<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100"><defs><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ff777c" stop-opacity=".35"/></linearGradient><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff4ca8"/><stop offset="1" stop-color="#ef42e8" stop-opacity=".4"/></linearGradient><linearGradient id="cool" x2="1" y2="1"><stop stop-color="#dd3ff4" stop-opacity=".8"/><stop offset="1" stop-color="#6d8eff" stop-opacity=".35"/></linearGradient><linearGradient id="line"><stop stop-color="#ffae27"/><stop offset=".5" stop-color="#ff58a5"/><stop offset="1" stop-color="#9c3cff"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>@media (prefers-reduced-motion:no-preference){.ambient-plane{transform-box:fill-box;transform-origin:center;animation:plane 7s ease-in-out 2s infinite alternate}.ambient-plane:nth-of-type(2n){animation-duration:8.5s;animation-delay:2.6s;animation-direction:alternate-reverse}.ambient-dot{transform-box:fill-box;transform-origin:center;animation:dot 6s ease-in-out 2s infinite alternate}.ambient-dot:nth-of-type(2n){animation-delay:3s;animation-direction:alternate-reverse}@keyframes plane{from{transform:translateY(-2px)}to{transform:translateY(3px)}}@keyframes dot{from{transform:translateY(-2px) scale(.9)}to{transform:translateY(2px) scale(1.15)}}}</style><ellipse cx="72" cy="76" rx="51" ry="14" fill="#c26de5" opacity=".25" filter="url(#glow)"/><path class="ambient-plane" d="M26 45 52 34 52 81 26 92Z" fill="url(#warm)"/><path class="ambient-plane" d="M45 35 72 24 72 72 45 83Z" fill="url(#pink)" opacity=".65"/><path class="ambient-plane" d="M65 26 91 15 91 63 65 74Z" fill="url(#pink)" opacity=".55"/><path class="ambient-plane" d="M85 18 111 7 111 54 85 65Z" fill="url(#cool)" opacity=".55"/><path d="M8 80 C21 32 41 43 57 42 C90 43 95 4 132 10" fill="none" stroke="url(#line)" stroke-width="1.3"/><circle class="ambient-dot" cx="8" cy="80" r="3.5" fill="#ff9a18"/><circle class="ambient-dot" cx="32" cy="39" r="3" fill="#ffae25"/><circle class="ambient-dot" cx="132" cy="10" r="3.5" fill="#a127ed"/></svg>