<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100"><defs><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ff777c" stop-opacity=".35"/></linearGradient><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff4ca8"/><stop offset="1" stop-color="#ef42e8" stop-opacity=".4"/></linearGradient><linearGradient id="cool" x2="1" y2="1"><stop stop-color="#dd3ff4" stop-opacity=".8"/><stop offset="1" stop-color="#6d8eff" stop-opacity=".35"/></linearGradient><linearGradient id="line"><stop stop-color="#ffae27"/><stop offset=".5" stop-color="#ff58a5"/><stop offset="1" stop-color="#9c3cff"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>@media (prefers-reduced-motion:no-preference){.ambient-plane{transform-box:fill-box;transform-origin:center;animation:plane 7s ease-in-out 2s infinite alternate}.ambient-plane:nth-of-type(2n){animation-duration:8.5s;animation-delay:2.6s;animation-direction:alternate-reverse}.ambient-dot{transform-box:fill-box;transform-origin:center;animation:dot 6s ease-in-out 2s infinite alternate}.ambient-dot:nth-of-type(2n){animation-delay:3s;animation-direction:alternate-reverse}@keyframes plane{from{transform:translateY(-2px)}to{transform:translateY(3px)}}@keyframes dot{from{transform:translateY(-2px) scale(.9)}to{transform:translateY(2px) scale(1.15)}}}</style><ellipse cx="70" cy="78" rx="52" ry="12" fill="#b67bef" opacity=".25" filter="url(#glow)"/><g fill="none" stroke="url(#line)" stroke-width="1" opacity=".5"><path d="M11 43 48 23 86 42 49 63Z M11 43v30l38 20V63 M86 42v31L49 93"/><path d="M58 22 96 2 132 20 95 41Z M132 20v36L95 76V41"/></g><path class="ambient-plane" d="M47 19 70 7 94 19 70 31Z" fill="#c39aff"/><path class="ambient-plane" d="M47 19 70 31 70 77 47 65Z" fill="url(#cool)" opacity=".75"/><path class="ambient-plane" d="M70 31 94 19 94 65 70 77Z" fill="#945af3" opacity=".42"/><path class="ambient-plane" d="M24 59 48 47 72 59 48 71Z" fill="#ffb147" opacity=".65"/><path class="ambient-plane" d="M24 59 48 71 48 94 24 82Z" fill="url(#warm)"/><path class="ambient-plane" d="M48 71 72 59 72 82 48 94Z" fill="#ff777b" opacity=".45"/><path class="ambient-plane" d="M70 52 94 40 118 52 94 64Z" fill="#ef3cdb" opacity=".6"/><path class="ambient-plane" d="M70 52 94 64 94 88 70 76Z" fill="url(#pink)" opacity=".5"/><path class="ambient-plane" d="M94 64 118 52 118 76 94 88Z" fill="url(#cool)" opacity=".55"/><circle class="ambient-dot" cx="11" cy="43" r="3" fill="#aa39ec"/><circle class="ambient-dot" cx="132" cy="20" r="3" fill="#ff8d38"/></svg>