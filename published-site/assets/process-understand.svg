<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100"><defs><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ff777c" stop-opacity=".35"/></linearGradient><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff4ca8"/><stop offset="1" stop-color="#ef42e8" stop-opacity=".4"/></linearGradient><linearGradient id="cool" x2="1" y2="1"><stop stop-color="#dd3ff4" stop-opacity=".8"/><stop offset="1" stop-color="#6d8eff" stop-opacity=".35"/></linearGradient><linearGradient id="line"><stop stop-color="#ffae27"/><stop offset=".5" stop-color="#ff58a5"/><stop offset="1" stop-color="#9c3cff"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>@media (prefers-reduced-motion:no-preference){.ambient-plane{transform-box:fill-box;transform-origin:center;animation:plane 7s ease-in-out 2s infinite alternate}.ambient-plane:nth-of-type(2n){animation-duration:8.5s;animation-delay:2.6s;animation-direction:alternate-reverse}.ambient-dot{transform-box:fill-box;transform-origin:center;animation:dot 6s ease-in-out 2s infinite alternate}.ambient-dot:nth-of-type(2n){animation-delay:3s;animation-direction:alternate-reverse}@keyframes plane{from{transform:translateY(-2px)}to{transform:translateY(3px)}}@keyframes dot{from{transform:translateY(-2px) scale(.9)}to{transform:translateY(2px) scale(1.15)}}}</style><ellipse cx="70" cy="66" rx="50" ry="19" fill="#bd69f4" opacity=".25" filter="url(#glow)"/><path class="ambient-plane" d="M25 28 C51 21 65 67 91 49 C105 38 110 18 125 17 L125 54 C110 78 93 88 68 72 C50 60 38 52 25 65Z" fill="url(#pink)" opacity=".28"/><path d="M12 77 C40 22 69 103 100 60 C116 39 112 22 128 16 M30 29 C56 8 75 38 100 47" fill="none" stroke="url(#line)" stroke-width="1.2"/><circle class="ambient-dot" cx="12" cy="77" r="4" fill="#ff9c13"/><circle class="ambient-dot" cx="40" cy="53" r="4" fill="#ff742b"/><circle class="ambient-dot" cx="91" cy="72" r="4" fill="#a842ff"/><circle class="ambient-dot" cx="128" cy="16" r="4" fill="#e522f0"/><circle class="ambient-dot" cx="78" cy="19" r="3" fill="#ff9717"/></svg>