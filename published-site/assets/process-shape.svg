<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100"><defs><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ff777c" stop-opacity=".35"/></linearGradient><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff4ca8"/><stop offset="1" stop-color="#ef42e8" stop-opacity=".4"/></linearGradient><linearGradient id="cool" x2="1" y2="1"><stop stop-color="#dd3ff4" stop-opacity=".8"/><stop offset="1" stop-color="#6d8eff" stop-opacity=".35"/></linearGradient><linearGradient id="line"><stop stop-color="#ffae27"/><stop offset=".5" stop-color="#ff58a5"/><stop offset="1" stop-color="#9c3cff"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>@media (prefers-reduced-motion:no-preference){.ambient-plane{transform-box:fill-box;transform-origin:center;animation:plane 7s ease-in-out 2s infinite alternate}.ambient-plane:nth-of-type(2n){animation-duration:8.5s;animation-delay:2.6s;animation-direction:alternate-reverse}.ambient-dot{transform-box:fill-box;transform-origin:center;animation:dot 6s ease-in-out 2s infinite alternate}.ambient-dot:nth-of-type(2n){animation-delay:3s;animation-direction:alternate-reverse}@keyframes plane{from{transform:translateY(-2px)}to{transform:translateY(3px)}}@keyframes dot{from{transform:translateY(-2px) scale(.9)}to{transform:translateY(2px) scale(1.15)}}}</style><ellipse cx="70" cy="78" rx="50" ry="13" fill="#b75ef5" opacity=".27" filter="url(#glow)"/><path class="ambient-plane" d="M16 66 69 38 123 65 70 94Z" fill="url(#cool)" opacity=".55"/><path class="ambient-plane" d="M16 48 69 20 123 47 70 76Z" fill="url(#pink)" opacity=".65"/><path class="ambient-plane" d="M25 36 69 12 113 35 70 60Z" fill="url(#warm)" opacity=".8"/><path d="M12 25 69 0 126 24 70 53Z" fill="none" stroke="url(#line)" stroke-width="1" opacity=".8"/><path d="M8 79 Q3 62 12 56" fill="none" stroke="#ffc160"/><circle class="ambient-dot" cx="8" cy="79" r="3" fill="#ff990d"/><circle class="ambient-dot" cx="12" cy="25" r="2.5" fill="#ff990d"/><circle class="ambient-dot" cx="126" cy="24" r="2.5" fill="#df31ef"/></svg>